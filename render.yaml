services:
  - type: web
    name: icbilling
    runtime: python
    buildCommand: "python -m py_compile server.py"
    startCommand: "python server.py"
    healthCheckPath: "/"
    disk:
      name: icbilling-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LEDGERLY_DATABASE
        value: /var/data/ledgerly.db
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: roomies-expenses
    runtime: python
    rootDir: roommate-expenses
    buildCommand: "python -m py_compile server.py"
    startCommand: "python server.py"
    healthCheckPath: "/"
    disk:
      name: roomies-expenses-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ROOMMATE_DATABASE
        value: /var/data/roommates.db
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_API_VERSION
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_GROUP_INVITE_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_GROUP_INVITE_TEMPLATE_LANGUAGE
        sync: false
